<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - AI Study Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color);">AI Study Planner</h1>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="subjects.html" class="active">Subjects</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>
        </header>

        <div class="dashboard-header">
            <h2>Manage Subjects</h2>
            <button class="btn btn-primary" id="open-subject-modal">+ Add Subject</button>
        </div>

        <div class="grid" id="subjects-grid">
            <!-- Subjects will be loaded here -->
        </div>
    </div>

    <!-- Subject Modal -->
    <div class="modal" id="subject-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Add New Subject</h2>
            <form id="subject-form">
                <input type="hidden" id="subject-id">
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="subject-name" required placeholder="e.g. Mathematics">
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea id="subject-desc" placeholder="What is this subject about?"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Subject</button>
                    <button type="button" class="btn btn-outline" id="close-subject-modal" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!localStorage.getItem('token')) window.location.href = 'index.html';

        const subjectsGrid = document.getElementById('subjects-grid');
        const subjectModal = document.getElementById('subject-modal');
        const subjectForm = document.getElementById('subject-form');

        async function loadSubjects() {
            try {
                const subjects = await api.getSubjects();
                subjectsGrid.innerHTML = subjects.length ? '' : '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">No subjects added yet.</p>';
                
                subjects.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${s.name}</h3>
                        <p>${s.description || 'No description'}</p>
                        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                            <button class="btn btn-outline" onclick="editSubject('${s.id}', '${s.name}', '${s.description || ''}')" style="padding: 0.4rem 0.8rem; flex: 1;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteSubject('${s.id}')" style="padding: 0.4rem 0.8rem; flex: 1;">Delete</button>
                        </div>
                    `;
                    subjectsGrid.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById('open-subject-modal').onclick = () => {
            document.getElementById('modal-title').textContent = 'Add New Subject';
            subjectForm.reset();
            document.getElementById('subject-id').value = '';
            subjectModal.style.display = 'flex';
        };

        document.getElementById('close-subject-modal').onclick = () => subjectModal.style.display = 'none';

        subjectForm.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('subject-id').value;
            const data = {
                name: document.getElementById('subject-name').value,
                description: document.getElementById('subject-desc').value
            };

            try {
                if (id) await api.updateSubject(id, data);
                else await api.createSubject(data);
                subjectModal.style.display = 'none';
                loadSubjects();
            } catch (err) { alert(err.message); }
        };

        window.editSubject = (id, name, desc) => {
            document.getElementById('modal-title').textContent = 'Edit Subject';
            document.getElementById('subject-id').value = id;
            document.getElementById('subject-name').value = name;
            document.getElementById('subject-desc').value = desc;
            subjectModal.style.display = 'flex';
        };

        window.deleteSubject = async (id) => {
            if (confirm('Are you sure you want to delete this subject?')) {
                try {
                    await api.deleteSubject(id);
                    loadSubjects();
                } catch (err) { alert(err.message); }
            }
        };

        document.getElementById('logout-btn').onclick = (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        };

        loadSubjects();
    </script>
</body>
</html>
